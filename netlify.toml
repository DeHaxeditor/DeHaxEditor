[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"


[[headers]]
  for = "/assets/js/runtime-config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[redirects]]
  from = "/membros"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/login"
  to = "/entrar/"
  status = 301

[[redirects]]
  from = "/comunidade"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/comunidade/"
  to = "/"
  status = 301
  force = true
