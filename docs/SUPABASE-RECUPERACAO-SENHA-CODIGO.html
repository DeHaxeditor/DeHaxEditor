<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#070a0f;color:#f4f7fb;font-family:Arial,Helvetica,sans-serif">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#070a0f;padding:32px 14px">
      <tr>
        <td align="center">
          <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px;background:#0b1118;border:1px solid #1d2935;border-radius:18px;overflow:hidden">
            <tr><td style="height:4px;background:linear-gradient(90deg,#00d9ff,#ff294d)"></td></tr>
            <tr>
              <td style="padding:32px">
                <div style="font-size:12px;font-weight:800;letter-spacing:.12em;color:#00d9ff">DEHAX EDITOR</div>
                <h1 style="margin:14px 0 8px;font-size:28px;line-height:1.05;color:#ffffff">Redefina sua senha</h1>
                <p style="margin:0 0 24px;color:#9aa7b4;font-size:14px;line-height:1.6">Recebemos uma solicitação para alterar a senha da sua conta. Digite o código abaixo na tela da DeHax.</p>
                <div style="padding:20px;border-radius:14px;border:1px solid #23313e;background:#070b10;text-align:center;font-size:34px;font-weight:900;letter-spacing:.24em;color:#ffffff">{{ .Token }}</div>
                <p style="margin:24px 0 0;color:#778593;font-size:12px;line-height:1.6">Se você não solicitou a troca de senha, ignore esta mensagem. Não compartilhe este código com ninguém.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
